<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="pumpBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e293b"/>
      <stop offset="50%" stopColor="#0f172a"/>
      <stop offset="100%" stopColor="#020617"/>
    </linearGradient>
    <linearGradient id="nozzleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0284c7"/>
      <stop offset="100%" stopColor="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="#090d16"/>
  <rect x="15" y="15" width="370" height="270" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>

  {/* Submersible Pump Body */}
  <g transform="translate(100, 50)">
    {/* Mounting Suction Cups (Bottom) */}
    <ellipse cx="60" cy="180" rx="18" ry="6" fill="#334155"/>
    <ellipse cx="140" cy="180" rx="18" ry="6" fill="#334155"/>

    {/* Main Cylindrical Motor Housing */}
    <rect x="30" y="50" width="140" height="125" rx="12" fill="url(#pumpBody)" stroke="#38bdf8" stroke-width="2"/>

    {/* Front Impeller Cover Plate */}
    <circle cx="100" cy="112" r="38" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <circle cx="100" cy="112" r="16" fill="#0284c7"/>
    {/* Impeller blades */}
    <path d="M 100 96 C 110 102, 110 110, 100 112" fill="none" stroke="#e0f2fe" stroke-width="2"/>
    <path d="M 100 128 C 90 122, 90 114, 100 112" fill="none" stroke="#e0f2fe" stroke-width="2"/>
    <path d="M 84 112 C 90 102, 98 102, 100 112" fill="none" stroke="#e0f2fe" stroke-width="2"/>
    <path d="M 116 112 C 110 122, 102 122, 100 112" fill="none" stroke="#e0f2fe" stroke-width="2"/>

    {/* Vertical Water Discharge Nozzle (Top) */}
    <rect x="86" y="15" width="28" height="36" rx="3" fill="url(#nozzleGrad)" stroke="#0369a1" stroke-width="1.5"/>
    {/* Nozzle barb rings */}
    <rect x="84" y="22" width="32" height="4" rx="1" fill="#7dd3fc"/>
    <rect x="84" y="32" width="32" height="4" rx="1" fill="#7dd3fc"/>

    {/* Rear Power Cable Gland */}
    <rect x="168" y="95" width="16" height="25" rx="3" fill="#334155"/>
    {/* Red & Black wires */}
    <path d="M 184 102 C 200 102, 215 85, 230 85" fill="none" stroke="#ef4444" stroke-width="3"/>
    <path d="M 184 112 C 200 112, 215 125, 230 125" fill="none" stroke="#000000" stroke-width="3"/>

    {/* Specs text print on pump side */}
    <text x="100" y="70" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#38bdf8" text-anchor="middle">JT-160A MINI DC</text>
    <text x="100" y="80" font-family="monospace" font-size="7" fill="#94a3b8" text-anchor="middle">12V DC • 240 L/H • IP68</text>
  </g>

  <text x="200" y="278" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">12V Mini Submersible Centrifugal Water Pump (Brushless)</text>
</svg>
