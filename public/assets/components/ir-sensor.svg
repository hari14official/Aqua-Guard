<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="irPcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e3a8a"/>
      <stop offset="100%" stopColor="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="#090d16"/>
  <rect x="15" y="15" width="370" height="270" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>

  {/* FC-51 IR Obstacle Sensor Board */}
  <g transform="translate(80, 55)">
    {/* Blue PCB substrate */}
    <rect x="30" y="20" width="180" height="150" rx="8" fill="url(#irPcb)" stroke="#2563eb" stroke-width="2"/>

    {/* Mounting hole */}
    <circle cx="45" cy="35" r="4.5" fill="#090d16" stroke="#fbbf24" stroke-width="1.5"/>

    {/* IR Transmitter (Transparent LED) */}
    <g transform="translate(0, 65)">
      <rect x="8" y="0" width="22" height="18" rx="2" fill="#334155"/>
      <path d="M 8 9 C 8 3, -10 3, -10 9 C -10 15, 8 15, 8 9 Z" fill="#93c5fd" opacity="0.85" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="-5" cy="9" r="2" fill="#ffffff"/>
      {/* IR Light Emission Waves */}
      <path d="M -16 3 C -20 6, -20 12, -16 15" fill="none" stroke="#60a5fa" stroke-width="2"/>
      <path d="M -22 0 C -28 5, -28 13, -22 18" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    </g>

    {/* IR Receiver Photodiode (Black casing) */}
    <g transform="translate(0, 105)">
      <rect x="8" y="0" width="22" height="18" rx="2" fill="#334155"/>
      <path d="M 8 9 C 8 3, -10 3, -10 9 C -10 15, 8 15, 8 9 Z" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <circle cx="-5" cy="9" r="2" fill="#1e293b"/>
      {/* Reflected IR waves entering */}
      <path d="M -16 3 C -20 6, -20 12, -16 15" fill="none" stroke="#f59e0b" stroke-width="2"/>
    </g>

    {/* LM393 Comparator IC */}
    <rect x="85" y="45" width="45" height="30" rx="2" fill="#0f172a" stroke="#334155"/>
    <circle cx="92" cy="51" r="1.5" fill="#94a3b8"/>
    <text x="107" y="63" font-family="monospace" font-size="7" fill="#60a5fa" text-anchor="middle">LM393</text>

    {/* Sensitivity Potentiometer (Blue with cross slot) */}
    <rect x="85" y="95" width="45" height="38" rx="3" fill="#2563eb" stroke="#1d4ed8"/>
    <circle cx="107.5" cy="114" r="9" fill="#e2e8f0" stroke="#475569"/>
    <line x1="101" y1="114" x2="114" y2="114" stroke="#1e293b" stroke-width="2"/>
    <line x1="107.5" y1="107.5" x2="107.5" y2="120.5" stroke="#1e293b" stroke-width="2"/>

    {/* Dual LEDs (Power Green & Sensor Active Red) */}
    <circle cx="150" cy="55" r="4" fill="#22c55e"/>
    <text x="160" y="58" font-family="monospace" font-size="6" fill="#86efac">PWR</text>
    <circle cx="150" cy="75" r="4" fill="#ef4444"/>
    <text x="160" y="78" font-family="monospace" font-size="6" fill="#fca5a5">OUT</text>

    {/* 3-pin Header (VCC, GND, OUT) */}
    <rect x="195" y="60" width="15" height="70" rx="2" fill="#1e293b" stroke="#64748b"/>
    <circle cx="202.5" cy="75" r="2.5" fill="#fbbf24"/>
    <circle cx="202.5" cy="95" r="2.5" fill="#fbbf24"/>
    <circle cx="202.5" cy="115" r="2.5" fill="#fbbf24"/>
    <text x="188" y="78" font-family="monospace" font-size="6" fill="#94a3b8" text-anchor="end">VCC</text>
    <text x="188" y="98" font-family="monospace" font-size="6" fill="#94a3b8" text-anchor="end">GND</text>
    <text x="188" y="118" font-family="monospace" font-size="6" fill="#94a3b8" text-anchor="end">OUT</text>
  </g>

  <text x="200" y="278" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">LM393 Infrared Obstacle & Inlet Debris Sensor Module</text>
</svg>
