<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="probeHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e293b"/>
      <stop offset="100%" stopColor="#0f172a"/>
    </linearGradient>
    <linearGradient id="irGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ef4444" stop-opacity="0.8"/>
      <stop offset="100%" stopColor="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="#090d16"/>
  <rect x="15" y="15" width="370" height="270" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>

  {/* Optical Probe Transducer Body */}
  <g transform="translate(60, 45)">
    {/* Upper Cylindrical Mount */}
    <rect x="35" y="10" width="70" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    {/* Cable boot & wires */}
    <rect x="60" y="0" width="20" height="12" rx="2" fill="#0f172a"/>
    <path d="M 65 0 C 65 -15, 85 -15, 110 -5" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <path d="M 70 0 C 70 -20, 100 -20, 120 -8" fill="none" stroke="#000000" stroke-width="2.5"/>
    <path d="M 75 0 C 75 -25, 115 -25, 130 -10" fill="none" stroke="#3b82f6" stroke-width="2.5"/>

    {/* U-Shaped Optical Slot Sensing Head */}
    <path d="M 40 70 L 40 160 C 40 180, 55 190, 70 190 C 85 190, 100 180, 100 160 L 100 70 Z" fill="url(#probeHead)" stroke="#38bdf8" stroke-width="2"/>
    {/* Optical U-Slot cutout */}
    <path d="M 60 110 L 60 165 C 60 172, 80 172, 80 165 L 80 110 Z" fill="#090d16" stroke="#475569" stroke-width="1.5"/>

    {/* 940nm IR Emitter Diode (Left Prong) */}
    <circle cx="55" cy="140" r="4.5" fill="#ef4444"/>
    {/* Phototransistor Receiver (Right Prong) */}
    <circle cx="85" cy="140" r="4.5" fill="#38bdf8"/>

    {/* Nephelometric Light Scattering Beam */}
    <path d="M 58 138 L 82 138 L 82 142 L 58 142 Z" fill="url(#irGlow)"/>
    <circle cx="70" cy="140" r="1.5" fill="#fbbf24"/>
    <circle cx="66" cy="136" r="1.5" fill="#fbbf24"/>
    <circle cx="74" cy="143" r="1.5" fill="#fbbf24"/>

    <text x="70" y="95" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#38bdf8" text-anchor="middle">TS-300B</text>
    <text x="70" y="105" font-family="monospace" font-size="6" fill="#94a3b8" text-anchor="middle">940nm OPTIC</text>
  </g>

  {/* LM393 Signal Conditioning Board */}
  <g transform="translate(210, 55)">
    <rect x="0" y="0" width="130" height="150" rx="6" fill="#047857" stroke="#10b981" stroke-width="1.5"/>
    {/* Mounting Holes */}
    <circle cx="12" cy="12" r="3.5" fill="#090d16" stroke="#fbbf24" stroke-width="1"/>
    <circle cx="118" cy="138" r="3.5" fill="#090d16" stroke="#fbbf24" stroke-width="1"/>

    {/* 3-pin Probe Connector */}
    <rect x="40" y="6" width="50" height="18" rx="2" fill="#f8fafc" stroke="#475569"/>
    <circle cx="52" cy="15" r="2.5" fill="#d97706"/>
    <circle cx="65" cy="15" r="2.5" fill="#d97706"/>
    <circle cx="78" cy="15" r="2.5" fill="#d97706"/>

    {/* LM393 Dual Comparator IC */}
    <rect x="45" y="45" width="40" height="28" rx="2" fill="#0f172a" stroke="#334155"/>
    <circle cx="51" cy="51" r="1.5" fill="#94a3b8"/>
    <text x="65" y="62" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">LM393</text>

    {/* Multi-turn Blue Cermet Trimmer Potentiometer */}
    <rect x="42" y="85" width="46" height="26" rx="2" fill="#2563eb" stroke="#1d4ed8"/>
    <circle cx="65" cy="98" r="7" fill="#cbd5e1" stroke="#475569"/>
    <line x1="60" y1="98" x2="70" y2="98" stroke="#1e293b" stroke-width="2"/>

    {/* 4-Pin Output Header */}
    <rect x="35" y="126" width="60" height="18" rx="2" fill="#1e293b" stroke="#64748b"/>
    <circle cx="45" cy="135" r="2" fill="#fbbf24"/>
    <circle cx="58" cy="135" r="2" fill="#fbbf24"/>
    <circle cx="71" cy="135" r="2" fill="#fbbf24"/>
    <circle cx="84" cy="135" r="2" fill="#fbbf24"/>

    {/* Text labels */}
    <text x="65" y="40" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#ecfdf5" text-anchor="middle">TURBIDITY BOARD</text>
    <text x="65" y="121" font-family="monospace" font-size="6" fill="#a7f3d0" text-anchor="middle">VCC • GND • DO • AO</text>
  </g>

  <text x="200" y="278" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">TS-300B Nephelometric Turbidity Sensor & Conditioning Board</text>
</svg>
