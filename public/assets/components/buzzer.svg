<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="buzzerCap" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#334155"/>
      <stop offset="60%" stopColor="#0f172a"/>
      <stop offset="100%" stopColor="#020617"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="#090d16"/>
  <rect x="15" y="15" width="370" height="270" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>

  {/* Active Piezo Buzzer */}
  <g transform="translate(130, 45)">
    {/* Sound Waves radiating out */}
    <path d="M 125 45 C 145 55, 145 95, 125 105" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 140 35 C 165 50, 165 100, 140 115" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 155 25 C 185 45, 185 105, 155 125" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

    {/* Cylindrical Plastic Resonator Body */}
    <circle cx="70" cy="75" r="65" fill="url(#buzzerCap)" stroke="#475569" stroke-width="2.5"/>

    {/* Central Sound Emission Port */}
    <circle cx="70" cy="75" r="16" fill="#020617" stroke="#1e293b" stroke-width="2"/>
    <circle cx="70" cy="75" r="8" fill="#000000"/>

    {/* Top Polarity + Marking & Branding */}
    <text x="35" y="55" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ef4444">+</text>
    <text x="70" y="120" font-family="monospace" font-size="8" font-weight="bold" fill="#94a3b8" text-anchor="middle">5V ACTIVE PIEZO</text>
    <text x="70" y="130" font-family="monospace" font-size="7" fill="#64748b" text-anchor="middle">85dB • 2.3kHz</text>

    {/* Wire leads beneath */}
    <rect x="52" y="140" width="6" height="35" rx="1" fill="#cbd5e1"/>
    <rect x="82" y="140" width="6" height="25" rx="1" fill="#cbd5e1"/>
  </g>

  <text x="200" y="278" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">5V Active Piezoelectric Warning Sounder (85dB Audible Alert)</text>
</svg>
